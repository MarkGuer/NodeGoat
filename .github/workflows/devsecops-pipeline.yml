
name: DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-semgrep:
    name: SAST - Semgrep Code Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: |
          python -m pip install --upgrade semgrep

      - name: Ejecutar analisis SAST con Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --sarif \
            --output semgrep-results.sarif .

      - name: Subir artefacto SARIF de Semgrep
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif-report
          path: semgrep-results.sarif
          if-no-files-found: warn

  sbom-syft:
    name: SBOM - Generacion CycloneDX con Syft
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Publicar artefacto SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error