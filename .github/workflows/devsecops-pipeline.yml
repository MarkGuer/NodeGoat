
name: DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-semgrep:
    name: SAST - Semgrep Code Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: |
          python -m pip install --upgrade semgrep

      - name: Ejecutar analisis SAST con Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --severity ERROR \
            --error \
            --sarif \
            --output semgrep-results.sarif .

      - name: Subir artefacto SARIF de Semgrep
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif-report
          path: semgrep-results.sarif
          if-no-files-found: warn

  sbom-syft:
    name: SBOM - Generacion CycloneDX con Syft
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Publicar artefacto SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error

  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: OWASP Dependency-Check Scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'NodeGoat'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --enableExperimental

      - name: Subir Reporte SCA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: warn

  quality-gate:
    name: QUALITY GATE - Politica de seguridad
    runs-on: ubuntu-latest
    needs:
      - sast-semgrep
      - sbom-syft
      - sca-dependency-check
    if: always()

    steps:
      - name: Evaluar resultados de seguridad
        env:
          SAST_RESULT: ${{ needs.sast-semgrep.result }}
          SCA_RESULT: ${{ needs.sca-dependency-check.result }}
        run: |
          echo "======================================"
          echo "       EVALUACION QUALITY GATE"
          echo "======================================"

          echo "Resultado SAST: $SAST_RESULT"
          echo "Resultado SCA:  $SCA_RESULT"

          FAILED=0

          if [ "$SAST_RESULT" != "success" ]; then
            echo "::error::QUALITY GATE FAIL: SAST no cumple la politica de seguridad."
            FAILED=1
          fi

          if [ "$SCA_RESULT" != "success" ]; then
            echo "::error::QUALITY GATE FAIL: SCA detecto vulnerabilidades con CVSS >= 7.0 o fallo el analisis."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "BUILD FAIL: No se cumplen los criterios de seguridad."
            exit 1
          fi

          echo "BUILD SUCCESS: Se cumplen los criterios del Quality Gate."
